<!DOCTYPE html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="FiberModeler — редактор бизнес-процессов BPMN 2.0 и IDEF0" />
    <title>FiberModeler</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%230a6cf1'/%3E%3Cpath d='M11 27c4.5 0 4.5-14 9-14s4.5 14 9 14' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='11' cy='27' r='3' fill='white'/%3E%3Ccircle cx='29' cy='27' r='3' fill='white'/%3E%3Ccircle cx='20' cy='13' r='3' fill='white'/%3E%3C/svg%3E" />
  <style>
/* FiberModeler design tokens — Apple-inspired: calm surfaces, one accent,
   generous spacing, SF typography, soft depth instead of heavy borders. */

:root {
  color-scheme: light;

  --font-ui: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue',
    'Segoe UI', Roboto, 'Inter', system-ui, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace;

  --fs-xs: 10.5px;
  --fs-sm: 11.5px;
  --fs-md: 13px;
  --fs-lg: 15px;
  --fs-xl: 19px;
  --fs-2xl: 26px;

  --r-sm: 6px;
  --r-md: 9px;
  --r-lg: 13px;
  --r-xl: 18px;
  --r-full: 999px;

  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 22px;
  --sp-6: 30px;

  /* light theme */
  --bg: #eef0f4;
  --bg-deep: #e4e7ec;
  --surface: rgba(255, 255, 255, 0.76);
  --surface-solid: #ffffff;
  --surface-raised: rgba(255, 255, 255, 0.92);
  --surface-sunken: rgba(120, 120, 128, 0.08);
  --hover: rgba(120, 120, 128, 0.1);
  --active: rgba(120, 120, 128, 0.16);
  --text: #1d1d1f;
  --text-secondary: #6e6e73;
  --text-tertiary: #9a9aa0;
  --separator: rgba(60, 60, 67, 0.13);
  --separator-strong: rgba(60, 60, 67, 0.22);
  --accent: #0a6cf1;
  --accent-hover: #0057ce;
  --accent-text: #ffffff;
  --accent-soft: rgba(10, 108, 241, 0.12);
  --accent-softer: rgba(10, 108, 241, 0.06);
  --success: #2f9e5e;
  --warning: #e08b00;
  --danger: #d64545;
  --guide: #ff375f;
  --handle-fill: #ffffff;
  --quick-fill: rgba(255, 255, 255, 0.95);

  --shadow-1: 0 1px 2px rgba(15, 20, 30, 0.06), 0 2px 10px rgba(15, 20, 30, 0.05);
  --shadow-2: 0 4px 14px rgba(15, 20, 30, 0.1), 0 1px 3px rgba(15, 20, 30, 0.06);
  --shadow-3: 0 18px 50px rgba(15, 20, 30, 0.22), 0 2px 8px rgba(15, 20, 30, 0.08);
  --blur: saturate(180%) blur(22px);

  /* canvas + diagram palette */
  --canvas-bg: #fbfbfd;
  --grid-fine: rgba(60, 60, 67, 0.055);
  --grid-strong: rgba(60, 60, 67, 0.11);
  --ruler-bg: #f3f4f7;
  --ruler-tick: #b6b8bf;
  --ruler-text: #8a8c93;
  --minimap-node: rgba(10, 108, 241, 0.28);
  --minimap-stroke: rgba(10, 108, 241, 0.5);

  --el-fill: #ffffff;
  --el-stroke: #5b6168;
  --el-text: #1d1d1f;
  --el-icon: #5b6168;
  --el-glyph-invert: #ffffff;
  --task-fill: #ffffff;
  --task-stroke: #9aa1a9;
  --gw-fill: #fffaf0;
  --gw-stroke: #d99a00;
  --ev-start-fill: #f0faf3;
  --ev-start-stroke: #2f9e5e;
  --ev-end-fill: #fdf1f1;
  --ev-end-stroke: #d64545;
  --ev-mid-fill: #fff8ec;
  --ev-mid-stroke: #d98324;
  --data-stroke: #7a8089;
  --pool-fill: #ffffff;
  --pool-header: #f2f3f5;
  --pool-stroke: #9aa1a9;
  --lane-fill: #ffffff;
  --flow-stroke: #3c4043;
  --fn-fill: #ffffff;
  --fn-stroke: #4a5056;
  --arrow-stroke: #3c4043;
  --anchor-fill: #f7f8fa;
}

:root[data-theme='dark'] {
  color-scheme: dark;

  --bg: #16171a;
  --bg-deep: #101113;
  --surface: rgba(38, 39, 43, 0.78);
  --surface-solid: #26272b;
  --surface-raised: rgba(48, 49, 54, 0.94);
  --surface-sunken: rgba(255, 255, 255, 0.05);
  --hover: rgba(255, 255, 255, 0.07);
  --active: rgba(255, 255, 255, 0.12);
  --text: #f2f2f5;
  --text-secondary: #a3a3aa;
  --text-tertiary: #78787f;
  --separator: rgba(255, 255, 255, 0.09);
  --separator-strong: rgba(255, 255, 255, 0.16);
  --accent: #3b8bff;
  --accent-hover: #63a2ff;
  --accent-text: #ffffff;
  --accent-soft: rgba(59, 139, 255, 0.18);
  --accent-softer: rgba(59, 139, 255, 0.09);
  --success: #43b877;
  --warning: #f0a92c;
  --danger: #ef5f5f;
  --handle-fill: #1c1d21;
  --quick-fill: rgba(30, 31, 35, 0.95);

  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.5);
  --shadow-2: 0 6px 18px rgba(0, 0, 0, 0.5);
  --shadow-3: 0 22px 60px rgba(0, 0, 0, 0.62);

  --canvas-bg: #1b1c20;
  --grid-fine: rgba(255, 255, 255, 0.045);
  --grid-strong: rgba(255, 255, 255, 0.085);
  --ruler-bg: #202126;
  --ruler-tick: #4d4f57;
  --ruler-text: #83858d;
  --minimap-node: rgba(59, 139, 255, 0.35);
  --minimap-stroke: rgba(59, 139, 255, 0.6);

  --el-fill: #2b2d33;
  --el-stroke: #8c929c;
  --el-text: #eceef2;
  --el-icon: #b3b8c2;
  --el-glyph-invert: #2b2d33;
  --task-fill: #2b2d33;
  --task-stroke: #8c929c;
  --gw-fill: #33301f;
  --gw-stroke: #e0ac3c;
  --ev-start-fill: #1f2f24;
  --ev-start-stroke: #4cb87d;
  --ev-end-fill: #332223;
  --ev-end-stroke: #ef6b6b;
  --ev-mid-fill: #332b1f;
  --ev-mid-stroke: #e5983f;
  --data-stroke: #99a0aa;
  --pool-fill: #212329;
  --pool-header: #2b2d33;
  --pool-stroke: #6e747e;
  --lane-fill: #1e2024;
  --flow-stroke: #c6cad2;
  --fn-fill: #2b2d33;
  --fn-stroke: #9aa1ab;
  --arrow-stroke: #c6cad2;
  --anchor-fill: #23252a;
}

* {
  box-sizing: border-box;
}

[hidden] {
  display: none !important;
}

html,
body {
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  font-family: var(--font-ui);
  font-size: var(--fs-md);
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  user-select: none;
}

input,
textarea,
select,
button {
  font: inherit;
  color: inherit;
}

::-webkit-scrollbar {
  width: 11px;
  height: 11px;
}
::-webkit-scrollbar-thumb {
  background: rgba(120, 120, 128, 0.35);
  border: 3px solid transparent;
  border-radius: var(--r-full);
  background-clip: content-box;
}
::-webkit-scrollbar-thumb:hover {
  background: rgba(120, 120, 128, 0.55);
  background-clip: content-box;
  border: 3px solid transparent;
}
::-webkit-scrollbar-track {
  background: transparent;
}

::selection {
  background: var(--accent-soft);
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* Application chrome: title bar, menus, toolbar, panels, dialogs. */

#app {
  display: grid;
  grid-template-rows: auto auto auto minmax(0, 1fr) auto auto;
  height: 100vh;
  height: 100dvh;
  background: var(--bg);
}

/* ------------------------------------------------------------- title bar */

.titlebar {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: 7px 14px;
  background: var(--surface);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border-bottom: 1px solid var(--separator);
  app-region: drag;
}

.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  padding-right: var(--sp-3);
  border-right: 1px solid var(--separator);
}

.brand-mark {
  width: 26px;
  height: 26px;
  flex: none;
}

.brand-name {
  font-size: 14.5px;
  font-weight: 600;
  letter-spacing: -0.02em;
}
.brand-name .brand-accent {
  color: var(--accent);
  font-weight: 500;
}

.doc-title {
  display: flex;
  align-items: baseline;
  gap: 8px;
  min-width: 0;
}
.doc-title .name {
  font-weight: 550;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 34vw;
}
.doc-title .hint {
  color: var(--text-tertiary);
  font-size: var(--fs-sm);
  white-space: nowrap;
}
.doc-title .dirty-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--warning);
  display: none;
}
.is-dirty .doc-title .dirty-dot {
  display: inline-block;
}

.titlebar-spacer {
  flex: 1;
}

/* ---------------------------------------------------------------- menubar */

.menubar {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 0 10px;
  height: 34px;
  background: var(--surface);
  backdrop-filter: var(--blur);
  border-bottom: 1px solid var(--separator);
  position: relative;
  z-index: 60;
}

.menu-button {
  border: 0;
  background: transparent;
  border-radius: var(--r-sm);
  padding: 4px 10px;
  font-size: var(--fs-md);
  cursor: default;
  color: var(--text);
}
.menu-button:hover,
.menu-button.is-open {
  background: var(--hover);
}
.menu-button.is-open {
  background: var(--accent);
  color: var(--accent-text);
}

.menu-popup {
  position: fixed;
  min-width: 232px;
  padding: 6px;
  background: var(--surface-raised);
  backdrop-filter: var(--blur);
  border: 1px solid var(--separator);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-3);
  z-index: 300;
  animation: pop 0.12s ease-out;
}

@keyframes pop {
  from {
    opacity: 0;
    transform: translateY(-4px) scale(0.98);
  }
}

.menu-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 6px 10px;
  border: 0;
  border-radius: var(--r-sm);
  background: transparent;
  text-align: left;
  font-size: var(--fs-md);
  cursor: default;
  white-space: nowrap;
}
.menu-item:hover:not(:disabled) {
  background: var(--accent);
  color: var(--accent-text);
}
.menu-item:disabled {
  color: var(--text-tertiary);
}
.menu-item .shortcut {
  margin-left: auto;
  color: var(--text-tertiary);
  font-size: var(--fs-sm);
  font-variant-numeric: tabular-nums;
}
.menu-item:hover:not(:disabled) .shortcut {
  color: rgba(255, 255, 255, 0.75);
}
.menu-item .check {
  width: 13px;
  opacity: 0;
}
.menu-item.is-checked .check {
  opacity: 1;
}
.menu-separator {
  height: 1px;
  margin: 5px 8px;
  background: var(--separator);
}
.menu-label {
  padding: 5px 10px 3px;
  font-size: var(--fs-xs);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-tertiary);
}

/* ---------------------------------------------------------------- toolbar */

.toolbar {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: 7px 12px;
  background: var(--bg);
  border-bottom: 1px solid var(--separator);
  overflow-x: auto;
  scrollbar-width: none;
}
.toolbar::-webkit-scrollbar {
  display: none;
}

.tool-group {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 2px;
  background: var(--surface-sunken);
  border-radius: var(--r-md);
}

.tool-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-width: 30px;
  height: 28px;
  padding: 0 7px;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: var(--text);
  cursor: default;
  transition: background 0.12s ease, color 0.12s ease, transform 0.08s ease;
}
.tool-btn:hover:not(:disabled) {
  background: var(--surface-solid);
  box-shadow: var(--shadow-1);
}
.tool-btn:active:not(:disabled) {
  transform: scale(0.96);
}
.tool-btn:disabled {
  opacity: 0.35;
}
.tool-btn.is-active {
  background: var(--accent);
  color: var(--accent-text);
  box-shadow: none;
}
.tool-btn svg {
  width: 17px;
  height: 17px;
  stroke-width: 1.6;
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.tool-btn .label {
  font-size: var(--fs-sm);
  padding-right: 2px;
}

.toolbar-spacer {
  flex: 1;
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: var(--r-full);
  background: var(--accent);
  color: var(--accent-text);
  font-size: var(--fs-sm);
  font-weight: 550;
  cursor: default;
  box-shadow: var(--shadow-1);
}
.pill:hover {
  background: var(--accent-hover);
}
.pill.secondary {
  background: var(--surface-solid);
  color: var(--text);
  border: 1px solid var(--separator);
}
.pill.secondary:hover {
  background: var(--hover);
}

/* -------------------------------------------------------------- workspace */

.workspace {
  display: grid;
  grid-template-columns: var(--left-w, 258px) 1fr var(--right-w, 288px);
  min-height: 0;
  background: var(--bg);
}
.workspace.no-left {
  grid-template-columns: 0 1fr var(--right-w, 288px);
}
.workspace.no-right {
  grid-template-columns: var(--left-w, 258px) 1fr 0;
}
.workspace.no-left.no-right {
  grid-template-columns: 0 1fr 0;
}

.sidebar {
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--surface);
  backdrop-filter: var(--blur);
  overflow: hidden;
}
.sidebar.left {
  border-right: 1px solid var(--separator);
}
.sidebar.right {
  border-left: 1px solid var(--separator);
}
.workspace.no-left .sidebar.left,
.workspace.no-right .sidebar.right {
  display: none;
}

.panel-head {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 10px 12px 6px;
  font-size: var(--fs-xs);
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--text-tertiary);
}
.panel-head .actions {
  margin-left: auto;
  display: flex;
  gap: 2px;
}
.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border: 0;
  border-radius: var(--r-sm);
  background: transparent;
  color: var(--text-secondary);
  cursor: default;
}
.icon-btn:hover {
  background: var(--hover);
  color: var(--text);
}
.icon-btn svg {
  width: 14px;
  height: 14px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ------------------------------------------------------------ model tree */

.tree {
  flex: 1;
  overflow: auto;
  padding: 0 8px 14px;
}
.tree-node {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 27px;
  padding: 0 8px;
  border-radius: 7px;
  font-size: var(--fs-md);
  cursor: default;
  white-space: nowrap;
}
.tree-node:hover {
  background: var(--hover);
}
.tree-node.is-active {
  background: var(--accent);
  color: var(--accent-text);
}
.tree-node.is-active .tree-badge {
  background: rgba(255, 255, 255, 0.22);
  color: #fff;
}
.tree-node .twisty {
  width: 13px;
  display: inline-flex;
  justify-content: center;
  color: var(--text-tertiary);
  transition: transform 0.12s ease;
}
.tree-node.is-collapsed .twisty {
  transform: rotate(-90deg);
}
.tree-node .tree-icon {
  width: 15px;
  height: 15px;
  flex: none;
  opacity: 0.85;
}
.tree-node .tree-text {
  overflow: hidden;
  text-overflow: ellipsis;
}
.tree-node.is-group {
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-top: 8px;
}
.tree-badge {
  margin-left: auto;
  font-size: var(--fs-xs);
  padding: 1px 6px;
  border-radius: var(--r-full);
  background: var(--surface-sunken);
  color: var(--text-tertiary);
}
.tree-empty {
  padding: 10px 14px;
  color: var(--text-tertiary);
  font-size: var(--fs-sm);
}

/* -------------------------------------------------------------- centre */

.center {
  position: relative;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
}

.tabstrip {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 6px 10px 0;
  overflow-x: auto;
  scrollbar-width: none;
  background: var(--bg);
}
.tabstrip::-webkit-scrollbar {
  display: none;
}
.tab {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 28px;
  padding: 0 10px;
  border-radius: 8px 8px 0 0;
  font-size: var(--fs-sm);
  color: var(--text-secondary);
  cursor: default;
  white-space: nowrap;
  border: 1px solid transparent;
  border-bottom: 0;
}
.tab:hover {
  background: var(--hover);
}
.tab.is-active {
  background: var(--canvas-bg);
  color: var(--text);
  border-color: var(--separator);
}
.tab .close {
  opacity: 0.4;
  width: 14px;
  height: 14px;
  border-radius: 4px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.tab .close:hover {
  opacity: 1;
  background: var(--active);
}
.tab .notation-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
}
.tab[data-notation='idef0'] .notation-dot {
  background: var(--warning);
}

.canvas-stage {
  position: relative;
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: auto 1fr;
  grid-template-rows: auto 1fr;
  background: var(--canvas-bg);
  border-top: 1px solid var(--separator);
}

.ruler-corner {
  width: 20px;
  height: 20px;
  background: var(--ruler-bg);
  border-right: 1px solid var(--separator);
  border-bottom: 1px solid var(--separator);
}
canvas.ruler-h {
  height: 20px;
  width: 100%;
  border-bottom: 1px solid var(--separator);
}
canvas.ruler-v {
  width: 20px;
  height: 100%;
  border-right: 1px solid var(--separator);
}
.canvas-stage.no-rulers .ruler-corner,
.canvas-stage.no-rulers canvas.ruler-h,
.canvas-stage.no-rulers canvas.ruler-v {
  display: none;
}
.canvas-stage.no-rulers {
  grid-template-columns: 1fr;
  grid-template-rows: 1fr;
}

/* --------------------------------------------------------------- palette */

.work-row {
  display: flex;
  flex: 1;
  min-height: 0;
  min-width: 0;
}

.palette-rail {
  position: relative;
  margin: 10px 0 10px 10px;
  width: 214px;
  flex: none;
  display: flex;
  flex-direction: column;
  background: var(--surface-raised);
  backdrop-filter: var(--blur);
  border: 1px solid var(--separator);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-2);
  z-index: 20;
  overflow: hidden;
  transition: width 0.18s ease, transform 0.18s ease;
}
.palette-rail.is-collapsed {
  width: 46px;
}
.palette-rail.is-collapsed .palette-body,
.palette-rail.is-collapsed .palette-search,
.palette-rail.is-collapsed .palette-title {
  display: none;
}
.palette-header {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 8px 6px 12px;
}
.palette-title {
  font-size: var(--fs-xs);
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--text-tertiary);
}
.palette-search {
  margin: 0 10px 8px;
}
.palette-body {
  flex: 1;
  overflow: auto;
  padding: 0 8px 10px;
}
.palette-group-title {
  padding: 8px 6px 4px;
  font-size: var(--fs-xs);
  font-weight: 600;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.palette-items {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 3px;
}
.palette-rail.is-collapsed + .canvas-stage {
  border-left: 0;
}
.palette-item {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 42px;
  border-radius: 8px;
  cursor: grab;
  background: transparent;
  border: 1px solid transparent;
}
.palette-item:hover {
  background: var(--hover);
  border-color: var(--separator);
}
.palette-item.is-active {
  background: var(--accent-soft);
  border-color: var(--accent);
}
.palette-item svg {
  width: 32px;
  height: 32px;
  pointer-events: none;
}
.palette-item[data-kind='edge'] svg {
  width: 34px;
  height: 22px;
}

.tooltip {
  position: fixed;
  z-index: 500;
  padding: 5px 9px;
  background: rgba(30, 30, 34, 0.94);
  color: #fff;
  font-size: var(--fs-sm);
  border-radius: var(--r-sm);
  pointer-events: none;
  box-shadow: var(--shadow-2);
  max-width: 260px;
}

/* -------------------------------------------------------------- floating */

.canvas-controls {
  position: absolute;
  right: 18px;
  bottom: 18px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 10px;
  z-index: 25;
}
.zoom-widget {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  background: var(--surface-raised);
  backdrop-filter: var(--blur);
  border: 1px solid var(--separator);
  border-radius: var(--r-full);
  box-shadow: var(--shadow-2);
}
.zoom-widget .value {
  min-width: 52px;
  text-align: center;
  font-size: var(--fs-sm);
  font-variant-numeric: tabular-nums;
  color: var(--text-secondary);
}
.minimap {
  width: 208px;
  height: 138px;
  background: var(--surface-raised);
  backdrop-filter: var(--blur);
  border: 1px solid var(--separator);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-2);
  overflow: hidden;
}
.minimap-svg {
  width: 100%;
  height: 100%;
  display: block;
}
.minimap-view {
  fill: var(--accent-soft);
  stroke: var(--accent);
}

/* --------------------------------------------------------------- bottom */

.bottom-panel {
  height: 190px;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  backdrop-filter: var(--blur);
  border-top: 1px solid var(--separator);
}
.bottom-panel[hidden] {
  display: none;
}
.bottom-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 12px;
  border-bottom: 1px solid var(--separator);
}
.bottom-head .title {
  font-size: var(--fs-sm);
  font-weight: 600;
}
.bottom-body {
  flex: 1;
  overflow: auto;
  padding: 4px 0 8px;
}
.problem-row {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  padding: 6px 14px;
  font-size: var(--fs-md);
  cursor: default;
  border-left: 3px solid transparent;
}
.problem-row:hover {
  background: var(--hover);
}
.problem-row.severity-error {
  border-left-color: var(--danger);
}
.problem-row.severity-warning {
  border-left-color: var(--warning);
}
.problem-row.severity-info {
  border-left-color: var(--accent);
}
.problem-row .where {
  margin-left: auto;
  color: var(--text-tertiary);
  font-size: var(--fs-sm);
  white-space: nowrap;
}
.problem-icon {
  width: 15px;
  height: 15px;
  flex: none;
  margin-top: 1px;
}
.empty-note {
  padding: 18px;
  text-align: center;
  color: var(--text-tertiary);
  font-size: var(--fs-md);
}

/* ------------------------------------------------------------- statusbar */

.statusbar {
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  height: 26px;
  padding: 0 14px;
  font-size: var(--fs-sm);
  color: var(--text-secondary);
  background: var(--surface);
  backdrop-filter: var(--blur);
  border-top: 1px solid var(--separator);
}
.statusbar .spacer {
  flex: 1;
}
.statusbar .chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-variant-numeric: tabular-nums;
}
.statusbar .chip.clickable:hover {
  color: var(--text);
}
.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--success);
}
.status-dot.is-warning {
  background: var(--warning);
}
.status-dot.is-error {
  background: var(--danger);
}

/* ------------------------------------------------------- properties panel */

.props {
  flex: 1;
  overflow: auto;
  padding: 0 14px 20px;
}
.props-section {
  margin-top: 14px;
}
.props-section > h4 {
  margin: 0 0 8px;
  font-size: var(--fs-xs);
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--text-tertiary);
}
.field {
  margin-bottom: 9px;
}
.field > label {
  display: block;
  margin-bottom: 4px;
  font-size: var(--fs-sm);
  color: var(--text-secondary);
}
.field-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.input,
.select,
.textarea {
  width: 100%;
  padding: 6px 9px;
  border: 1px solid var(--separator-strong);
  border-radius: 7px;
  background: var(--surface-solid);
  font-size: var(--fs-md);
  user-select: text;
  transition: border-color 0.12s ease, box-shadow 0.12s ease;
}
.input:focus,
.select:focus,
.textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-softer);
}
.textarea {
  resize: vertical;
  min-height: 54px;
  line-height: 1.45;
}
.select {
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--text-secondary) 50%),
    linear-gradient(135deg, var(--text-secondary) 50%, transparent 50%);
  background-position: calc(100% - 15px) 13px, calc(100% - 10px) 13px;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  padding-right: 26px;
}
.input[type='color'] {
  padding: 2px;
  height: 30px;
  cursor: default;
}
.checkbox {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: var(--fs-md);
}
.checkbox input {
  width: 15px;
  height: 15px;
  accent-color: var(--accent);
}

.switch {
  position: relative;
  width: 38px;
  height: 22px;
  border-radius: var(--r-full);
  background: var(--separator-strong);
  transition: background 0.16s ease;
  flex: none;
}
.switch::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #fff;
  box-shadow: var(--shadow-1);
  transition: transform 0.16s ease;
}
.switch input {
  position: absolute;
  opacity: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  cursor: default;
}
.switch:has(input:checked) {
  background: var(--success);
}
.switch:has(input:checked)::after {
  transform: translateX(16px);
}

.props-empty {
  padding: 40px 18px;
  text-align: center;
  color: var(--text-tertiary);
}
.props-empty svg {
  width: 44px;
  height: 44px;
  opacity: 0.35;
  margin-bottom: 12px;
}
.props-title {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 12px 0 2px;
}
.props-title .type-icon {
  width: 30px;
  height: 30px;
  flex: none;
}
.props-title .type-name {
  font-weight: 600;
  font-size: var(--fs-lg);
  letter-spacing: -0.01em;
}
.props-title .type-sub {
  font-size: var(--fs-sm);
  color: var(--text-tertiary);
}
.inline-actions {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 6px;
}

/* --------------------------------------------------------------- dialogs */

.scrim {
  position: fixed;
  inset: 0;
  background: rgba(20, 22, 26, 0.34);
  backdrop-filter: blur(3px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 400;
  animation: fade 0.14s ease-out;
}
@keyframes fade {
  from {
    opacity: 0;
  }
}
.dialog {
  width: min(680px, 92vw);
  max-height: 86vh;
  display: flex;
  flex-direction: column;
  background: var(--surface-raised);
  backdrop-filter: var(--blur);
  border: 1px solid var(--separator);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-3);
  overflow: hidden;
  animation: rise 0.18s cubic-bezier(0.2, 0.9, 0.3, 1);
}
@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(12px) scale(0.98);
  }
}
.dialog.wide {
  width: min(960px, 95vw);
}
.dialog.narrow {
  width: min(460px, 92vw);
}
.dialog-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 16px 20px 10px;
}
.dialog-head h2 {
  margin: 0;
  font-size: var(--fs-xl);
  font-weight: 600;
  letter-spacing: -0.02em;
}
.dialog-head .sub {
  color: var(--text-secondary);
  font-size: var(--fs-sm);
  margin-top: 2px;
}
.dialog-body {
  padding: 6px 20px 18px;
  overflow: auto;
  user-select: text;
}
.dialog-foot {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 20px;
  border-top: 1px solid var(--separator);
  background: var(--surface);
}
.dialog-foot .spacer {
  flex: 1;
}
.dialog-foot:empty {
  display: none;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  height: 31px;
  padding: 0 15px;
  border: 1px solid var(--separator-strong);
  border-radius: 8px;
  background: var(--surface-solid);
  font-size: var(--fs-md);
  cursor: default;
  transition: background 0.12s ease, transform 0.08s ease;
}
.btn:hover:not(:disabled) {
  background: var(--hover);
}
.btn:active:not(:disabled) {
  transform: scale(0.98);
}
.btn:disabled {
  opacity: 0.45;
}
.btn.primary {
  background: var(--accent);
  border-color: transparent;
  color: var(--accent-text);
  font-weight: 550;
}
.btn.primary:hover:not(:disabled) {
  background: var(--accent-hover);
}
.btn.danger {
  color: var(--danger);
}
.btn.ghost {
  border-color: transparent;
  background: transparent;
}
.btn.ghost:hover {
  background: var(--hover);
}

.segmented {
  display: inline-flex;
  padding: 2px;
  background: var(--surface-sunken);
  border-radius: 9px;
  gap: 2px;
}
.segmented button {
  border: 0;
  background: transparent;
  border-radius: 7px;
  padding: 5px 13px;
  font-size: var(--fs-sm);
  cursor: default;
  color: var(--text-secondary);
}
.segmented button.is-active {
  background: var(--surface-solid);
  color: var(--text);
  box-shadow: var(--shadow-1);
  font-weight: 550;
}

.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 10px;
}
.card {
  padding: 12px 14px;
  border: 1px solid var(--separator);
  border-radius: var(--r-md);
  background: var(--surface-solid);
  cursor: default;
  transition: border-color 0.12s ease, transform 0.1s ease;
}
.card:hover {
  border-color: var(--accent);
  transform: translateY(-1px);
}
.card.is-selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-softer);
}
.card h5 {
  margin: 0 0 4px;
  font-size: var(--fs-md);
  font-weight: 600;
}
.card p {
  margin: 0;
  font-size: var(--fs-sm);
  color: var(--text-secondary);
  line-height: 1.4;
}

.settings-layout {
  display: grid;
  grid-template-columns: 178px 1fr;
  gap: 18px;
  min-height: 380px;
}
.settings-nav {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.settings-nav button {
  text-align: left;
  border: 0;
  background: transparent;
  padding: 7px 11px;
  border-radius: 8px;
  font-size: var(--fs-md);
  cursor: default;
}
.settings-nav button:hover {
  background: var(--hover);
}
.settings-nav button.is-active {
  background: var(--accent);
  color: var(--accent-text);
  font-weight: 550;
}
.settings-pane {
  min-width: 0;
}
.note {
  padding: 10px 12px;
  border-radius: var(--r-md);
  background: var(--accent-softer);
  color: var(--text-secondary);
  font-size: var(--fs-sm);
  line-height: 1.5;
}

table.grid {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: var(--fs-sm);
}
table.grid th {
  text-align: left;
  font-weight: 600;
  color: var(--text-secondary);
  padding: 6px 8px;
  border-bottom: 1px solid var(--separator);
  white-space: nowrap;
}
table.grid td {
  padding: 3px 4px;
  border-bottom: 1px solid var(--separator);
}
table.grid input,
table.grid select {
  width: 100%;
  border: 1px solid transparent;
  background: transparent;
  border-radius: 6px;
  padding: 5px 7px;
  font-size: var(--fs-sm);
  user-select: text;
}
table.grid input:hover,
table.grid select:hover {
  border-color: var(--separator);
}
table.grid input:focus,
table.grid select:focus {
  outline: none;
  border-color: var(--accent);
  background: var(--surface-solid);
}
table.grid td.num {
  width: 34px;
  color: var(--text-tertiary);
  text-align: center;
}
table.grid td.act {
  width: 30px;
}

/* ------------------------------------------------------- command palette */

.cmdk {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  padding-top: 13vh;
  background: rgba(20, 22, 26, 0.3);
  backdrop-filter: blur(3px);
  z-index: 420;
}
.cmdk-box {
  width: min(620px, 92vw);
  max-height: 62vh;
  display: flex;
  flex-direction: column;
  background: var(--surface-raised);
  backdrop-filter: var(--blur);
  border: 1px solid var(--separator);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-3);
  overflow: hidden;
  animation: rise 0.16s cubic-bezier(0.2, 0.9, 0.3, 1);
}
.cmdk-input {
  border: 0;
  border-bottom: 1px solid var(--separator);
  padding: 15px 18px;
  font-size: var(--fs-lg);
  background: transparent;
  user-select: text;
}
.cmdk-input:focus {
  outline: none;
}
.cmdk-list {
  overflow: auto;
  padding: 6px;
}
.cmdk-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 11px;
  border-radius: 8px;
  cursor: default;
  font-size: var(--fs-md);
}
.cmdk-item .hint {
  margin-left: auto;
  color: var(--text-tertiary);
  font-size: var(--fs-sm);
}
.cmdk-item.is-active {
  background: var(--accent);
  color: var(--accent-text);
}
.cmdk-item.is-active .hint {
  color: rgba(255, 255, 255, 0.72);
}
.cmdk-item svg {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
}

/* ---------------------------------------------------------------- toasts */

.toasts {
  position: fixed;
  bottom: 44px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  z-index: 450;
  pointer-events: none;
}
.toast {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 9px 16px;
  border-radius: var(--r-full);
  background: rgba(30, 30, 34, 0.93);
  color: #fff;
  font-size: var(--fs-md);
  box-shadow: var(--shadow-3);
  animation: toast-in 0.22s cubic-bezier(0.2, 0.9, 0.3, 1);
  max-width: 70vw;
}
.toast.is-error {
  background: rgba(190, 50, 50, 0.95);
}
.toast.is-success {
  background: rgba(35, 120, 70, 0.95);
}
@keyframes toast-in {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
}

/* --------------------------------------------------------- context menu */

.context-menu {
  position: fixed;
  min-width: 212px;
  max-height: 72vh;
  overflow: auto;
  padding: 6px;
  background: var(--surface-raised);
  backdrop-filter: var(--blur);
  border: 1px solid var(--separator);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-3);
  z-index: 320;
  animation: pop 0.1s ease-out;
}
.context-menu .submenu-arrow {
  margin-left: auto;
  color: var(--text-tertiary);
}

/* --------------------------------------------------------------- welcome */

.welcome {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  z-index: 200;
}
.welcome-card {
  width: min(880px, 92vw);
  display: grid;
  grid-template-columns: 1.15fr 1fr;
  background: var(--surface-raised);
  border: 1px solid var(--separator);
  border-radius: 20px;
  box-shadow: var(--shadow-3);
  overflow: hidden;
}
.welcome-left {
  padding: 34px 34px 30px;
}
.welcome-left h1 {
  margin: 14px 0 4px;
  font-size: 30px;
  letter-spacing: -0.03em;
  font-weight: 600;
}
.welcome-left p.sub {
  margin: 0 0 22px;
  color: var(--text-secondary);
}
.welcome-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-width: 300px;
}
.welcome-steps {
  margin-top: 24px;
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.welcome-step {
  display: flex;
  gap: 10px;
  font-size: var(--fs-sm);
  color: var(--text-secondary);
  align-items: flex-start;
}
.welcome-step .n {
  width: 19px;
  height: 19px;
  flex: none;
  border-radius: 50%;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: var(--fs-xs);
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.welcome-right {
  background: linear-gradient(160deg, var(--accent-softer), transparent 60%), var(--surface-sunken);
  border-left: 1px solid var(--separator);
  padding: 26px 24px;
  display: flex;
  flex-direction: column;
}
.recent-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
  overflow: auto;
}
.recent-item {
  display: flex;
  flex-direction: column;
  gap: 1px;
  padding: 8px 10px;
  border-radius: 8px;
  cursor: default;
}
.recent-item:hover {
  background: var(--hover);
}
.recent-item .name {
  font-size: var(--fs-md);
  font-weight: 550;
}
.recent-item .meta {
  font-size: var(--fs-xs);
  color: var(--text-tertiary);
}

@media (max-width: 900px) {
  .welcome-card {
    grid-template-columns: 1fr;
  }
  .welcome-right {
    display: none;
  }
  .workspace {
    grid-template-columns: 0 1fr 0;
  }
}

/* Canvas surface, overlays and printing. */

.canvas-root {
  position: relative;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  background: var(--canvas-bg);
  touch-action: none;
}

.canvas-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  cursor: default;
}

.canvas-root[data-tool='pan'] .canvas-svg,
.canvas-root.is-panning .canvas-svg {
  cursor: grab;
}
.canvas-root.is-panning .canvas-svg:active {
  cursor: grabbing;
}
.canvas-root[data-tool='place'] .canvas-svg,
.canvas-root[data-tool='connect'] .canvas-svg {
  cursor: crosshair;
}
.canvas-root.is-drop-target {
  box-shadow: inset 0 0 0 2px var(--accent);
}

.canvas-svg text {
  font-family: var(--font-ui);
  pointer-events: none;
  user-select: none;
}

.node {
  cursor: move;
}
.node:hover .el-label {
  /* keeps labels readable while the hover outline is drawn */
  opacity: 1;
}
.edge {
  cursor: pointer;
}
.edge-hit {
  pointer-events: stroke;
}
.edge-line,
.edge-arrow,
.edge-label {
  pointer-events: none;
}

.layer-overlay {
  pointer-events: none;
}
.layer-overlay .ov-handle,
.layer-overlay .ov-quick,
.layer-overlay .ov-waypoint,
.layer-overlay .ov-endpoint {
  pointer-events: all;
}
.layer-overlay .ov-handle {
  cursor: nwse-resize;
}
.layer-overlay .ov-handle[data-handle='n'],
.layer-overlay .ov-handle[data-handle='s'] {
  cursor: ns-resize;
}
.layer-overlay .ov-handle[data-handle='e'],
.layer-overlay .ov-handle[data-handle='w'] {
  cursor: ew-resize;
}
.layer-overlay .ov-handle[data-handle='ne'],
.layer-overlay .ov-handle[data-handle='sw'] {
  cursor: nesw-resize;
}
.layer-overlay .ov-quick {
  cursor: crosshair;

/**
 * IndexedDB storage: projects live in the browser so a session survives a
 * reload, a crash or a closed tab - exactly what a desktop app would do with
 * its working directory.
 */
const DB_NAME = 'fibermodeler';
const DB_VERSION = 1;
const STORE_PROJECTS = 'projects';
const STORE_STATE = 'state';

let dbPromise = null;

function openDb() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    if (typeof indexedDB === 'undefined') {
      reject(new Error('IndexedDB is not available'));
      return;
    }
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onupgradeneeded = () => {
      const db = request.result;
      if (!db.objectStoreNames.contains(STORE_PROJECTS)) {
        const store = db.createObjectStore(STORE_PROJECTS, { keyPath: 'id' });
        store.createIndex('updatedAt', 'updatedAt');
      }
      if (!db.objectStoreNames.contains(STORE_STATE)) db.createObjectStore(STORE_STATE, { keyPath: 'key' });
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
  return dbPromise;
}

async function tx(store, mode, fn) {
  const db = await openDb();
  return new Promise((resolve, reject) => {
    const transaction = db.transaction(store, mode);
    const objectStore = transaction.objectStore(store);
    let result;
    try {
      result = fn(objectStore);
    } catch (err) {
      reject(err);
      return;
    }
    transaction.oncomplete = () => resolve(result?.result ?? result);
    transaction.onerror = () => reject(transaction.error);
  });

    ['C', x + w, y + h - b + b * k, x + w - a + a * k, y + h, x + w - a, y + h],
    ['L', x + a, y + h],
    ['C', x + a - a * k, y + h, x, y + h - b + b * k, x, y + h - b],
    ['L', x, y + b],
    ['C', x, y + b - b * k, x + a - a * k, y, x + a, y],
    ['Z'],
  ];
}

function ellipsePath(cx, cy, rx, ry) {
  const k = 0.5523;
  return [
    ['M', cx - rx, cy],
    ['C', cx - rx, cy - ry * k, cx - rx * k, cy - ry, cx, cy - ry],
    ['C', cx + rx * k, cy - ry, cx + rx, cy - ry * k, cx + rx, cy],
    ['C', cx + rx, cy + ry * k, cx + rx * k, cy + ry, cx, cy + ry],
    ['C', cx - rx * k, cy + ry, cx - rx, cy + ry * k, cx - rx, cy],
    ['Z'],
  ];
}

function parsePathData(d) {
  const commands = [];
  const tokens = String(d).match(/[a-zA-Z]|-?\d*\.?\d+(?:e[-+]?\d+)?/gi) || [];
  let i = 0;
  let cmd = 'M';
  let cx = 0;
  let cy = 0;
  let startX = 0;
  let startY = 0;
  let lastControl = null;
  const num = () => Number(tokens[i++]);
  while (i < tokens.length) {
    if (/[a-zA-Z]/.test(tokens[i])) cmd = tokens[i++];
    const relative = cmd === cmd.toLowerCase();
    const type = cmd.toUpperCase();
    const rx = (v) => (relative ? cx + v : v);
    const ry = (v) => (relative ? cy + v : v);
    switch (type) {
      case 'M': {
        const x = rx(num());
        const y = ry(num());
        commands.push(['M', x, y]);
        cx = startX = x;
        cy = startY = y;
        cmd = relative ? 'l' : 'L';
        lastControl = null;
        break;
      }
      case 'L': {
        const x = rx(num());
        const y = ry(num());
        commands.push(['L', x, y]);
        cx = x;
        cy = y;
        lastControl = null;
        break;
      }
      case 'H': {
        const x = rx(num());
        commands.push(['L', x, cy]);
        cx = x;
        lastControl = null;
        break;
      }
      case 'V': {
        const y = ry(num());
        commands.push(['L', cx, y]);
        cy = y;
        lastControl = null;
        break;
      }
      case 'C': {
        const x1 = rx(num());
        const y1 = ry(num());
        const x2 = rx(num());
        const y2 = ry(num());
        const x = rx(num());
        const y = ry(num());
        commands.push(['C', x1, y1, x2, y2, x, y]);
        lastControl = { x: x2, y: y2 };
        cx = x;
        cy = y;
        break;
      }
      case 'S': {
        const x2 = rx(num());
        const y2 = ry(num());
        const x = rx(num());
        const y = ry(num());
        const x1 = lastControl ? 2 * cx - lastControl.x : cx;
        const y1 = lastControl ? 2 * cy - lastControl.y : cy;
        commands.push(['C', x1, y1, x2, y2, x, y]);
        lastControl = { x: x2, y: y2 };
        cx = x;
        cy = y;
        break;
      }
      case 'Q': {
        const qx = rx(num());
        const qy = ry(num());
        const x = rx(num());
        const y = ry(num());
        commands.push(quadToCubic(cx, cy, qx, qy, x, y));
        lastControl = { x: qx, y: qy, quad: true };
        cx = x;
        cy = y;
        break;
      }
      case 'T': {
        const x = rx(num());
        const y = ry(num());
        const qx = lastControl?.quad ? 2 * cx - lastControl.x : cx;
        const qy = lastControl?.quad ? 2 * cy - lastControl.y : cy;
        commands.push(quadToCubic(cx, cy, qx, qy, x, y));
        lastControl = { x: qx, y: qy, quad: true };
        cx = x;
        cy = y;
        break;
      }
      case 'A': {
        const rxv = num();
        const ryv = num();
        const rotation = num();
        const largeArc = num();
        const sweep = num();
        const x = rx(num());
        const y = ry(num());
        for (const segment of arcToCubic(cx, cy, rxv, ryv, rotation, largeArc, sweep, x, y)) commands.push(segment);
        cx = x;
        cy = y;
        lastControl = null;
        break;
      }
      case 'Z':
        commands.push(['Z']);
        cx = startX;
        cy = startY;
        lastControl = null;
        break;
      default:
        i++;
        break;
    }
  }
  return commands;
}

function quadToCubic(x0, y0, qx, qy, x, y) {
  return ['C', x0 + (2 / 3) * (qx - x0), y0 + (2 / 3) * (qy - y0), x + (2 / 3) * (qx - x), y + (2 / 3) * (qy - y), x, y];
}

function arcToCubic(x0, y0, rx, ry, rotation, largeArc, sweep, x, y) {
  if (!rx || !ry) return [['L', x, y]];
  const phi = (rotation * Math.PI) / 180;
  const cos = Math.cos(phi);
  const sin = Math.sin(phi);
  const dx = (x0 - x) / 2;
  const dy = (y0 - y) / 2;
  const x1 = cos * dx + sin * dy;
  const y1 = -sin * dx + cos * dy;
  let rxs = rx * rx;
  let rys = ry * ry;
  const lambda = (x1 * x1) / rxs + (y1 * y1) / rys;
  if (lambda > 1) {
    const scale = Math.sqrt(lambda);
    rx *= scale;
    ry *= scale;
    rxs = rx * rx;
    rys = ry * ry;
  }
  const sign = largeArc === sweep ? -1 : 1;
  const numerator = Math.max(0, rxs * rys - rxs * y1 * y1 - rys * x1 * x1);
  const denominator = rxs * y1 * y1 + rys * x1 * x1 || 1;
  const coefficient = sign * Math.sqrt(numerator / denominator);
  const cx1 = (coefficient * rx * y1) / ry;
  const cy1 = (-coefficient * ry * x1) / rx;
  const cx = cos * cx1 - sin * cy1 + (x0 + x) / 2;
  const cy = sin * cx1 + cos * cy1 + (y0 + y) / 2;
  const angle = (ux, uy, vx, vy) => {
    const dot = ux * vx + uy * vy;
    const len = Math.sqrt((ux * ux + uy * uy) * (vx * vx + vy * vy)) || 1;
    let a = Math.acos(Math.min(1, Math.max(-1, dot / len)));
    if (ux * vy - uy * vx < 0) a = -a;
    return a;
  };
  const theta = angle(1, 0, (x1 - cx1) / rx, (y1 - cy1) / ry);
  let delta = angle((x1 - cx1) / rx, (y1 - cy1) / ry, (-x1 - cx1) / rx, (-y1 - cy1) / ry);
  if (!sweep && delta > 0) delta -= 2 * Math.PI;
  if (sweep && delta < 0) delta += 2 * Math.PI;
  const segments = Math.ceil(Math.abs(delta / (Math.PI / 2)));
  const step = delta / segments;
  const result = [];
  let start = theta;
  for (let i = 0; i < segments; i++) {
    const end = start + step;
    const k = (4 / 3) * Math.tan(step / 4);
    const p1 = point(cx, cy, rx, ry, cos, sin, start);
    const p2 = point(cx, cy, rx, ry, cos, sin, end);
    const d1 = derivative(rx, ry, cos, sin, start);
    const d2 = derivative(rx, ry, cos, sin, end);
    result.push(['C', p1.x + k * d1.x, p1.y + k * d1.y, p2.x - k * d2.x, p2.y - k * d2.y, p2.x, p2.y]);
    start = end;
  }
  return result;
}

function point(cx, cy, rx, ry, cos, sin, angle) {
  const x = rx * Math.cos(angle);
  const y = ry * Math.sin(angle);
  return { x: cx + cos * x - sin * y, y: cy + sin * x + cos * y };
}

function derivative(rx, ry, cos, sin, angle) {
  const x = -rx * Math.sin(angle);
  const y = ry * Math.cos(angle);
  return { x: cos * x - sin * y, y: sin * x + cos * y };
}

/* ------------------------------------------------------------- SVG walking */

const INHERITED = ['fill', 'stroke', 'stroke-width', 'font-size', 'font-weight', 'text-anchor', 'opacity', 'color', 'stroke-dasharray', 'stroke-linecap', 'stroke-linejoin', 'fill-opacity', 'stroke-opacity'];

function styleOf(node, parentStyle) {
  const style = { ...parentStyle };
  const inline = {};
  if (node.attrs.style) {
    for (const rule of node.attrs.style.split(';')) {
      const [key, value] = rule.split(':').map((s) => (s || '').trim());
      if (key) inline[key] = value;
    }
  }
  for (const key of INHERITED) {
    const value = inline[key] ?? node.attrs[key];
    if (value !== undefined && value !== '') style[key] = value;
  }
  return style;
}

class ContentBuilder {
  constructor(font) {
    this.ops = [];
    this.font = font;
    this.glyphs = new Set([0]);
    this.alphas = new Map();
  }

  push(op) {
    this.ops.push(op);
  }

  alphaState(fillAlpha, strokeAlpha) {
    const key = `${fillAlpha}|${strokeAlpha}`;
    if (!this.alphas.has(key)) this.alphas.set(key, { name: `GS${this.alphas.size}`, fillAlpha, strokeAlpha });
    return this.alphas.get(key).name;
  }

  toString() {
    return this.ops.join('\n');
  }
}

function emitPath(builder, commands, style, state) {
  const fill = parseColor(style.fill ?? '#000000', state);
  const stroke = parseColor(style.stroke, state);
  const hasFill = fill !== null && fill !== undefined;
  const hasStroke = stroke !== null && stroke !== undefined && Number(style['stroke-width'] ?? 1) !== 0;
  if (!hasFill && !hasStroke) return;

  const opacity = Number(style.opacity ?? 1);
  const fillAlpha = Number(style['fill-opacity'] ?? 1) * opacity;
  const strokeAlpha = Number(style['stroke-opacity'] ?? 1) * opacity;
  builder.push('q');
  if (fillAlpha < 1 || strokeAlpha < 1) builder.push(`/${builder.alphaState(fillAlpha, strokeAlpha)} gs`);
  if (hasFill) builder.push(colorOp(fill, false));
  if (hasStroke) {
    builder.push(colorOp(stroke, true));
    builder.push(`${round(Number(style['stroke-width'] ?? 1))} w`);
    const cap = { butt: 0, round: 1, square: 2 }[style['stroke-linecap']] ?? 0;
    const join = { miter: 0, round: 1, bevel: 2 }[style['stroke-linejoin']] ?? 0;
    builder.push(`${cap} J ${join} j`);
    const dash = style['stroke-dasharray'];
    if (dash && dash !== 'none') {
      const values = dash.split(/[\s,]+/).filter(Boolean).map(Number).filter((v) => Number.isFinite(v));
      builder.push(`[${values.map(round).join(' ')}] 0 d`);
    } else {
      builder.push('[] 0 d');
    }
  }
  for (const command of commands) {
    const [type, ...args] = command;
    const values = [];
    for (let i = 0; i < args.length; i += 2) {
      const p = transformPoint(state.matrix, args[i], args[i + 1]);
      values.push(round(p.x), round(p.y));
    }
    if (type === 'M') builder.push(`${values[0]} ${values[1]} m`);
    else if (type === 'L') builder.push(`${values[0]} ${values[1]} l`);
    else if (type === 'C') builder.push(`${values.join(' ')} c`);
    else if (type === 'Z') builder.push('h');
  }
  builder.push(hasFill && hasStroke ? 'B' : hasFill ? 'f' : 'S');
  builder.push('Q');
}

function transformPoint(matrix, x, y) {
  return { x: matrix[0] * x + matrix[2] * y + matrix[4], y: matrix[1] * x + matrix[3] * y + matrix[5] };
}

function textWidth(text, fontSize) {
  let total = 0;
  for (const ch of text) {
    const code = ch.codePointAt(0);
    const width = FIBER_SANS.widths[String(code)] ?? FIBER_SANS.widths['32'] ?? 600;
    total += width;
  }
  return (total / FIBER_SANS.unitsPerEm) * fontSize;
}

function encodeText(text, builder) {
  let hex = '';
  for (const ch of text) {
    const code = ch.codePointAt(0);
    const gid = FIBER_SANS.gid[String(code)] ?? FIBER_SANS.gid['63'] ?? 0;
    builder.glyphs.add(gid);
    hex += gid.toString(16).padStart(4, '0');
  }
  return hex;
}

function emitText(builder, node, style, state, inherited = {}) {
  const fontSize = Number(style['font-size'] ?? inherited.fontSize ?? 12);
  const anchor = style['text-anchor'] || 'start';
  const bold = String(style['font-weight'] || '').match(/bold|[6-9]00/);
  const color = parseColor(style.fill ?? '#000000', state) || [0, 0, 0];
  const opacity = Number(style.opacity ?? 1) * Number(style['fill-opacity'] ?? 1);

  const runs = [];
  const collect = (element, x, y) => {
    const spans = element.children.filter((c) => c.tag === 'tspan');
    if (spans.length) {
      for (const span of spans) {
        collect(span, span.attrs.x !== undefined ? Number(span.attrs.x) : x, span.attrs.y !== undefined ? Number(span.attrs.y) : y);
      }
      if (element.text.trim()) runs.push({ text: element.text.trim(), x, y });
    } else {
      const text = (element.text || '').replace(/\s+/g, ' ').trim();
      if (text) runs.push({ text, x, y });
    }
  };
  collect(node, Number(node.attrs.x || 0), Number(node.attrs.y || 0));
  if (!runs.length) return;

  builder.push('q');
  if (opacity < 1) builder.push(`/${builder.alphaState(opacity, opacity)} gs`);
  builder.push(colorOp(color, false));
  if (bold) {
    builder.push(colorOp(color, true));
    builder.push(`${round(fontSize * 0.028)} w`);
  }
  builder.push('BT');
  builder.push(`/F1 ${round(fontSize)} Tf`);
  builder.push(bold ? '2 Tr' : '0 Tr');
  for (const run of runs) {
    const width = textWidth(run.text, fontSize);
    let x = run.x;
    if (anchor === 'middle') x -= width / 2;
    else if (anchor === 'end') x -= width;
    const m = multiply(state.matrix, [1, 0, 0, 1, x, run.y]);
    // flip the glyphs back: the page matrix mirrors the Y axis
    const tm = multiply(m, [1, 0, 0, -1, 0, 0]);
    builder.push(`${round(tm[0])} ${round(tm[1])} ${round(tm[2])} ${round(tm[3])} ${round(tm[4])} ${round(tm[5])} Tm`);
    builder.push(`<${encodeText(run.text, builder)}> Tj`);
  }
  builder.push('ET');
  builder.push('Q');
}

function walk(node, builder, state) {
  for (const child of node.children) {
    const style = styleOf(child, state.style);
    const color = child.attrs.color ? parseColor(child.attrs.color, state) : state.color;
    let matrix = state.matrix;
    if (child.attrs.transform) matrix = multiply(matrix, parseTransform(child.attrs.transform));
    const childState = { ...state, matrix, style, color };
    const a = child.attrs;
    switch (child.tag) {
      case 'g':
      case 'svg':
        walk(child, builder, childState);
        break;
      case 'rect':
        emitPath(
          builder,
          rectPath(Number(a.x || 0), Number(a.y || 0), Number(a.width || 0), Number(a.height || 0), Number(a.rx || 0), Number(a.ry || 0)),
          style,
          childState
        );
        break;
      case 'circle':
        emitPath(builder, ellipsePath(Number(a.cx || 0), Number(a.cy || 0), Number(a.r || 0), Number(a.r || 0)), style, childState);
        break;
      case 'ellipse':
        emitPath(builder, ellipsePath(Number(a.cx || 0), Number(a.cy || 0), Number(a.rx || 0), Number(a.ry || 0)), style, childState);
        break;
      case 'line':
        emitPath(builder, [['M', Number(a.x1 || 0), Number(a.y1 || 0)], ['L', Number(a.x2 || 0), Number(a.y2 || 0)]], { fill: 'none', ...style }, childState);
        break;
      case 'polyline':
      case 'polygon': {
        const points = String(a.points || '').trim().split(/[\s,]+/).map(Number);
        const commands = [];
        for (let i = 0; i + 1 < points.length; i += 2) commands.push([i === 0 ? 'M' : 'L', points[i], points[i + 1]]);
        if (child.tag === 'polygon') commands.push(['Z']);
        emitPath(builder, commands, child.tag === 'polyline' ? { fill: 'none', ...style } : style, childState);
        break;
      }
      case 'path':
        emitPath(builder, parsePathData(a.d || ''), style, childState);
        break;
      case 'text':
        emitText(builder, child, style, childState);
        break;
      case 'style':
      case 'defs':
      case 'title':
      case 'desc':
        break;
      default:
        walk(child, builder, childState);
        break;
    }
  }
}

/** Converts an SVG string into PDF operators inside the given page box. */
function svgToContent(svgMarkup, { x = 0, y = 0, width, height, pageHeight }) {
  const root = parseXml(svgMarkup);
  const svg = root.children.find((c) => c.tag === 'svg');
  if (!svg) throw new Error('Invalid SVG');
  const viewBox = String(svg.attrs.viewBox || '').trim().split(/[\s,]+/).map(Number);
  const vb = viewBox.length === 4 ? { x: viewBox[0], y: viewBox[1], w: viewBox[2], h: viewBox[3] } : { x: 0, y: 0, w: Number(svg.attrs.width) || width, h: Number(svg.attrs.height) || height };
  const scale = Math.min(width / vb.w, height / vb.h);
  const offsetX = x + (width - vb.w * scale) / 2;
  const offsetY = y + (height - vb.h * scale) / 2;

  // page space (y up) <- svg space (y down)
  const base = multiply([1, 0, 0, -1, 0, pageHeight], [scale, 0, 0, scale, offsetX, offsetY]);
  const matrix = multiply(base, [1, 0, 0, 1, -vb.x, -vb.y]);

  const builder = new ContentBuilder(FIBER_SANS);
  walk(svg, builder, {
    matrix,
    style: { fill: '#000000', 'font-size': 12 },
    color: [0, 0, 0],
  });
  return { content: builder.toString(), builder, scale, box: { x: offsetX, y: offsetY, w: vb.w * scale, h: vb.h * scale } };
}

/* ------------------------------------------------------------- PDF writing */

function pdfString(text) {
  return `(${String(text).replace(/[\\()]/g, (c) => `\\${c}`)})`;
}

function base64ToBytes(base64) {
  if (typeof atob === 'function') {
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }
  return Uint8Array.from(Buffer.from(base64, 'base64'));
}

/**
 * @param {Array<{width:number,height:number,content:string,alphas:Map,glyphs:Set}>} pages
 */
function buildPdf(pages, meta = {}) {
  const objects = [];
  const add = (data) => {
    objects.push(data);
    return objects.length; // 1-based object number
  };

  const fontBytes = base64ToBytes(FIBER_SANS_TTF_BASE64);
  const scale = 1000 / FIBER_SANS.unitsPerEm;
  const widths = [];
  const gidWidth = new Map();
  for (const [code, gid] of Object.entries(FIBER_SANS.gid)) {
    gidWidth.set(gid, Math.round((FIBER_SANS.widths[code] || 0) * scale));
  }
  const sortedGids = [...gidWidth.keys()].sort((a, b) => a - b);
  let run = null;
  for (const gid of sortedGids) {
    if (run && gid === run.start + run.values.length) run.values.push(gidWidth.get(gid));
    else {
      if (run) widths.push(`${run.start} [${run.values.join(' ')}]`);
      run = { start: gid, values: [gidWidth.get(gid)] };
    }
  }
  if (run) widths.push(`${run.start} [${run.values.join(' ')}]`);

  const catalogId = 1;
  const pagesId = 2;
  objects.push(null, null); // placeholders for catalog and pages

  const fontFileId = add({ stream: fontBytes, dict: `<< /Length ${fontBytes.length} /Length1 ${fontBytes.length} >>` });
  const descriptorId = add({
    raw: `<< /Type /FontDescriptor /FontName /${FIBER_SANS.name} /Flags 32 /FontBBox [${FIBER_SANS.bbox
      .map((v) => Math.round(v * scale))
      .join(' ')}] /ItalicAngle 0 /Ascent ${Math.round(FIBER_SANS.ascent * scale)} /Descent ${Math.round(
      FIBER_SANS.descent * scale
    )} /CapHeight ${Math.round(FIBER_SANS.capHeight * scale)} /StemV 80 /FontFile2 ${fontFileId} 0 R >>`,
  });
  const cidFontId = add({
    raw: `<< /Type /Font /Subtype /CIDFontType2 /BaseFont /${FIBER_SANS.name} /CIDSystemInfo << /Registry (Adobe) /Ordering (Identity) /Supplement 0 >> /FontDescriptor ${descriptorId} 0 R /DW 600 /W [${widths.join(
      ' '
    )}] /CIDToGIDMap /Identity >>`,
  });
  const toUnicode = buildToUnicode();
  const toUnicodeId = add({ stream: new TextEncoder().encode(toUnicode), dict: `<< /Length ${new TextEncoder().encode(toUnicode).length} >>` });
  const fontId = add({
    raw: `<< /Type /Font /Subtype /Type0 /BaseFont /${FIBER_SANS.name} /Encoding /Identity-H /DescendantFonts [${cidFontId} 0 R] /ToUnicode ${toUnicodeId} 0 R >>`,
  });

  const pageIds = [];
  for (const page of pages) {
    const contentBytes = new TextEncoder().encode(page.content);
    const contentId = add({ stream: contentBytes, dict: `<< /Length ${contentBytes.length} >>` });
    const gsEntries = [...(page.alphas?.values() || [])]
      .map((gs) => `/${gs.name} << /Type /ExtGState /ca ${round(gs.fillAlpha)} /CA ${round(gs.strokeAlpha)} >>`)
      .join(' ');
    const pageId = add({
      raw: `<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 ${round(page.width)} ${round(
        page.height
      )}] /Resources << /Font << /F1 ${fontId} 0 R >> /ExtGState << ${gsEntries} >> >> /Contents ${contentId} 0 R >>`,
    });
    pageIds.push(pageId);
  }

  objects[catalogId - 1] = { raw: `<< /Type /Catalog /Pages ${pagesId} 0 R >>` };
  objects[pagesId - 1] = {
    raw: `<< /Type /Pages /Kids [${pageIds.map((id) => `${id} 0 R`).join(' ')}] /Count ${pageIds.length} >>`,
  };

  const infoId = add({
    raw: `<< /Title ${pdfString(meta.title || 'FiberModeler diagram')} /Author ${pdfString(
      meta.author || ''
    )} /Creator ${pdfString('FiberModeler')} /Producer ${pdfString('FiberModeler PDF writer')} /CreationDate ${pdfString(
      pdfDate(new Date())
    )} >>`,
  });

  /* serialise */
  const chunks = [];
  const encoder = new TextEncoder();
  let offset = 0;
  const pushText = (text) => {
    const bytes = encoder.encode(text);
    chunks.push(bytes);
    offset += bytes.length;
  };
  const pushBytes = (bytes) => {
    chunks.push(bytes);
    offset += bytes.length;
  };

  pushText('%PDF-1.7\n%âãÏÓ\n');
  const offsets = [];
  objects.forEach((object, index) => {
    offsets[index] = offset;
    pushText(`${index + 1} 0 obj\n`);
    if (object.stream) {
      pushText(`${object.dict}\nstream\n`);
      pushBytes(object.stream);
      pushText('\nendstream\n');
    } else {
      pushText(`${object.raw}\n`);
    }
    pushText('endobj\n');
  });

  const xrefOffset = offset;
  let xref = `xref\n0 ${objects.length + 1}\n0000000000 65535 f \n`;
