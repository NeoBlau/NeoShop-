# Infrastructure for local development. Application processes run on the host
# (pnpm dev) so that HMR and the Vite dev server behave normally; only stateful
# services live in containers. `make dev` starts both halves.
services:
  postgres:
    image: postgres:16-alpine
    container_name: sfera-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sfera
      POSTGRES_PASSWORD: sfera
      POSTGRES_DB: sfera
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sfera -d sfera']
      interval: 5s
      timeout: 3s
      retries: 20

  # MinIO withdrew minio/minio and minio/mc from Docker Hub in September 2026 and
  # closed the quay.io mirrors behind authentication, so the upstream images
  # cannot be pulled at all any more — `docker pull` answers "pull access denied"
  # even with valid credentials. This is Bitnami's archived build of MinIO
  # 2025.5.24, the last community release and the only copy still open to
  # anonymous pulls. Behaviour is the MinIO the code is written against:
  # prefix-scoped anonymous policy for public/, presigned URLs for private/.
  #
  # Pinned to an exact tag, and not to `:latest`, which was a mistake that cost
  # somebody an evening. The repository is an archive but the tag is still
  # mutable: it moved from 2025.5.24 to 2025.7.23, the storage format moved with
  # it, and a machine that had already written a volume under the old build came
  # up with an unhealthy container and no explanation. An archived image is
  # exactly the kind you pin.
  minio:
    image: bitnamilegacy/minio:2025.5.24-debian-12-r7
    container_name: sfera-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: sfera
      MINIO_ROOT_PASSWORD: sfera-secret
      MINIO_API_PORT_NUMBER: 9000
      MINIO_CONSOLE_PORT_NUMBER: 9001
    ports:
      - '9000:9000'
      - '9001:9001'
    # Bitnami serves this directory rather than /data, and runs as uid 1001. A
    # named volume inherits the image's ownership, so the server can write to it.
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      # MinIO's own liveness endpoint, asked for with whichever fetcher the
      # image happens to carry.
      #
      # This used to run `mc alias set`, which is a stronger check — it proves
      # the credentials work as well as that the port answers. It is also a
      # check that fails when the image stops shipping mc, and then a perfectly
      # healthy server reports unhealthy and compose refuses to start anything
      # that depends on it. Readiness is the question being asked here; the
      # credentials are minio-init's problem, and it fails loudly on its own.
      test:
        [
          'CMD-SHELL',
          'curl -fsS http://127.0.0.1:9000/minio/health/live || wget -q -O- http://127.0.0.1:9000/minio/health/live',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      # MinIO checks its disks before it serves; on a cold volume that is a few
      # seconds during which a failing probe means nothing.
      start_period: 20s

  # Creates the bucket and makes only the `public/` prefix readable. Optimized
  # models and previews live under public/, originals stay private.
  minio-init:
    image: bitnamilegacy/minio:2025.5.24-debian-12-r7
    container_name: sfera-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ['/bin/sh', '/init/init-minio.sh']
    volumes:
      - ./docker/init-minio.sh:/init/init-minio.sh:ro
    restart: 'no'

  mailpit:
    image: axllent/mailpit:latest
    container_name: sfera-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
  minio-data:
