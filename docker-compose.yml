# Infrastructure for local development. Application processes run on the host
# (pnpm dev) so that HMR and the Vite dev server behave normally; only stateful
# services live in containers. `make dev` starts both halves.
services:
  postgres:
    image: postgres:16-alpine
    container_name: sfera-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sfera
      POSTGRES_PASSWORD: sfera
      POSTGRES_DB: sfera
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sfera -d sfera']
      interval: 5s
      timeout: 3s
      retries: 20

  # MinIO withdrew minio/minio and minio/mc from Docker Hub in September 2026 and
  # closed the quay.io mirrors behind authentication, so the upstream images
  # cannot be pulled at all any more — `docker pull` answers "pull access denied"
  # even with valid credentials. This is Bitnami's archived build of MinIO
  # 2025.5.24, the last community release and the only copy still open to
  # anonymous pulls. Behaviour is the MinIO the code is written against:
  # prefix-scoped anonymous policy for public/, presigned URLs for private/.
  minio:
    image: bitnamilegacy/minio:latest
    container_name: sfera-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: sfera
      MINIO_ROOT_PASSWORD: sfera-secret
      MINIO_API_PORT_NUMBER: 9000
      MINIO_CONSOLE_PORT_NUMBER: 9001
    ports:
      - '9000:9000'
      - '9001:9001'
    # Bitnami serves this directory rather than /data, and runs as uid 1001. A
    # named volume inherits the image's ownership, so the server can write to it.
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      # `mc alias set` refuses the alias unless the endpoint answers and the
      # credentials work, which is exactly the readiness question. mc ships
      # inside this image; the explicit config directory is because $HOME is /
      # and uid 1001 cannot write there. The credentials are repeated rather
      # than read from the environment so that no `$` needs escaping through
      # both compose and the container shell.
      test:
        [
          'CMD',
          'mc',
          '--config-dir',
          '/tmp/mc',
          'alias',
          'set',
          'health',
          'http://127.0.0.1:9000',
          'sfera',
          'sfera-secret',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the bucket and makes only the `public/` prefix readable. Optimized
  # models and previews live under public/, originals stay private.
  minio-init:
    image: bitnamilegacy/minio:latest
    container_name: sfera-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ['/bin/sh', '/init/init-minio.sh']
    volumes:
      - ./docker/init-minio.sh:/init/init-minio.sh:ro
    restart: 'no'

  mailpit:
    image: axllent/mailpit:latest
    container_name: sfera-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
  minio-data:
