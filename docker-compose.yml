# Infrastructure for local development. Application processes run on the host
# (pnpm dev) so that HMR and the Vite dev server behave normally; only stateful
# services live in containers. `make dev` starts both halves.
services:
  postgres:
    image: postgres:16-alpine
    container_name: sfera-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sfera
      POSTGRES_PASSWORD: sfera
      POSTGRES_DB: sfera
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sfera -d sfera']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: sfera-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sfera
      MINIO_ROOT_PASSWORD: sfera-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the bucket and makes only the `public/` prefix readable. Optimized
  # models and previews live under public/, originals stay private.
  minio-init:
    image: minio/mc:latest
    container_name: sfera-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ['/bin/sh', '/init/init-minio.sh']
    volumes:
      - ./docker/init-minio.sh:/init/init-minio.sh:ro
    restart: 'no'

  mailpit:
    image: axllent/mailpit:latest
    container_name: sfera-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
  minio-data:
